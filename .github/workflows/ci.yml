# 푸시·PR마다 타입 검사, 테스트, MCP 종단 하네스, 패키지 내용을 확인한다.
# 네트워크가 필요 없는 것만 돈다 (에이전트 하네스·벤치는 실제 Claude를 불러 로컬에서만).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # engines는 node >= 22.13 (node:sqlite) — 지원 범위 양끝, 그리고 macOS(사용자 대부분)
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          # Windows는 경로·홈 폴더(USERPROFILE·APPDATA)·PATH 처리가 달라 따로 돌린다
          - { os: windows-latest, node: 22 }
    env:
      # CI에서는 GitHub 릴리스를 묻지 않는다
      GRIMOIRE_UPDATE_CHECK: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # 의존성의 설치 스크립트는 돌리지 않는다 — lockfile에 hasInstallScript인 패키지가 없어 결과는 같다
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e
      - name: 패키지 내용
        run: npm pack --dry-run
