# v* 태그를 push하면 npm에 배포하고 GitHub 릴리스를 만든다.
#
# 순서가 중요하다: 업데이트 확인은 GitHub 릴리스를 보고 `grimoire update`는 그 버전을 npm에서 받으므로,
# npm에 먼저 올라간 뒤에야 릴리스를 만든다(알림을 받았는데 받을 버전이 없는 일이 없게).
#
# npm 배포는 Trusted Publishing(OIDC)으로 한다 — 토큰 시크릿이 없고, 2FA 계정에서도 동작하며, provenance가 붙는다.
# 처음 한 번 npmjs.com의 패키지 Settings → Trusted Publisher에 이 레포와 release.yml을 등록해야 한다.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GRIMOIRE_UPDATE_CHECK: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing은 npm 11.5.1 이상이 필요하다
      - run: npm install -g npm@latest

      - name: 태그와 package.json 버전이 같은지
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 package.json $version 이 다릅니다"
            exit 1
          fi
      - name: 태그가 main 위에 있는지 (clone 사용자의 update는 main을 fast-forward한다)
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME 이 main에 없는 커밋을 가리킵니다"
            exit 1
          fi

      - run: npm ci
      - run: npm run e2e

      - name: npm 배포 (prepublishOnly가 dist를 새로 빌드하고 테스트를 돌린다)
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version 은 이미 npm에 있습니다 — 건너뜁니다 (재실행)"
          else
            npm publish --provenance --access public
          fi

      - name: GitHub 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "릴리스 $GITHUB_REF_NAME 이 이미 있습니다 — 건너뜁니다"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
