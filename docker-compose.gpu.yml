# GPU 가속 오버레이 (선택사항) — 기본 compose에 얹어서 쓴다:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile llm up -d
#
# 매번 -f 를 치기 싫으면 .env 에 (Windows는 구분자 ';', Linux/macOS는 ':'):
#   COMPOSE_FILE=docker-compose.yml;docker-compose.gpu.yml
#
# 요구사항:
#   Windows: Docker Desktop + WSL2 백엔드 + NVIDIA 드라이버(WSL용 CUDA)
#   Linux:   nvidia-container-toolkit
# GPU가 없으면 이 파일 없이 기본 compose만 쓰면 CPU로 동작한다.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
