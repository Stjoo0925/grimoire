# Grimoire — compose 프로파일 조립식 (PLANNING.md §5)
#
#   docker compose --profile app up -d                 # 웹앱만
#   docker compose --profile app --profile llm up -d   # 웹앱 + 로컬 Ollama (풀 로컬)
#   docker compose --profile db  up -d                 # 그래프/벡터 DB (2차 준비용)
#
# 어떤 조합이든 ./data 를 공유한다 — 스냅샷·그래프 JSON이 호스트(npm run dev)와 같은 자리에 쌓인다.
# 환경변수는 .env.local 에서 읽는다 (.env.example 참고, git에는 올리지 않는다).

services:
  # ── profile: app ── Next.js 웹앱 (2D 서재 + 수집기 + 그래프 빌더) ──────
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: grimoire-web:local
    container_name: grimoire-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    # AUTH_SECRET / AUTH_GITHUB_ID / AUTH_GITHUB_SECRET / GRAPH_EXTRACTOR 등.
    # 이 파일은 커밋하지 않는다 — .env.example을 복사해 만들 것.
    env_file:
      - .env.local
    environment:
      # 컨테이너 안에서 Ollama는 호스트 localhost가 아니라 서비스 이름으로 붙는다.
      # (llm 프로파일을 안 켰으면 auto가 조용히 none으로 내려간다)
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      # 수집 스냅샷(data/{login}.json)과 그래프(data/graph/{login}.json)를 호스트와 공유
      - ./data:/app/data

  # ── profile: mcp ── MCP 서버 (원격 연결용 Streamable HTTP) ────────────
  # 로컬에서 Claude Desktop/Cursor에 붙일 때는 이 컨테이너가 필요 없다 —
  # stdio 모드로 `node dist-mcp/mcp/server.js` 또는 `docker run -i` 를 쓰면 된다(README).
  # ⚠ 여기서 뜨는 것은 원격 노출 모드다. MCP_AUTH_TOKEN 없이는 기동을 거부한다.
  #    TLS는 앞단(리버스 프록시/터널)이 담당한다.
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    image: grimoire-mcp:local
    container_name: grimoire-mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=${MCP_PORT:-8765}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - GRIMOIRE_LOGIN=${GRIMOIRE_LOGIN:-}
    volumes:
      # 웹앱과 같은 ./data 를 읽는다 (PLANNING.md §5 원칙 1)
      - ./data:/app/data

  # ── profile: llm ── 로컬 LLM (프라이버시 기본값, PLANNING.md §7) ───────
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: grimoire-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      # 요청이 끝나면 즉시 GPU에서 모델을 내린다 (기본 5분 유지 대신).
      - OLLAMA_KEEP_ALIVE=0
    volumes:
      # 내려받은 모델 가중치 (수 GB) — named volume이라 재시작해도 다시 받지 않는다.
      # (올인 컨테이너 원칙: DB성 데이터는 호스트 폴더가 아니라 도커 볼륨에 산다. PLANNING.md §8)
      - grimoire-ollama:/root/.ollama
    # 기동 시 모델을 자동으로 내려받는다. 이미 볼륨에 있으면 즉시 끝난다(idempotent).
    # 수동으로 하려면: docker exec grimoire-ollama ollama pull qwen2.5:7b-instruct
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        echo "[grimoire] waiting for ollama..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "[grimoire] pulling $${OLLAMA_MODEL}"
        ollama pull "$${OLLAMA_MODEL}" || echo "[grimoire] pull 실패 — 서버는 계속 뜹니다"
        wait $$server_pid
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 첫 모델 다운로드(수 GB)가 끝날 때까지는 unhealthy로 보지 않는다.
      start_period: 600s
    # 기본은 CPU 동작 (GPU 없는 머신에서도 그대로 뜬다).
    # NVIDIA GPU 가속은 선택사항 — docker-compose.gpu.yml 오버레이를 얹는다:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile llm up -d

  # ── profile: db ── 2차(그래프 DB 전환) 준비용 ─────────────────────────
  # 주의: 지금 코드는 이 DB들을 사용하지 않는다. 1차 저장은 JSON(./data)이며
  # (PLANNING.md §8 "그래프 저장 1차: JSON"), Neo4j/Qdrant는 5차 로드맵에서 붙인다.
  neo4j:
    profiles: ["db"]
    image: neo4j:5.26-community
    container_name: grimoire-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      # 비밀번호는 .env(또는 셸)의 NEO4J_PASSWORD에서 온다.
      # 아래 자리표시자 그대로 띄우지 말 것 — .env.example 참고해 반드시 바꿀 것.
      # (compose는 프로파일과 무관하게 파일 전체를 치환하므로 :? 대신 기본값을 둔다)
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change-me-please}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - grimoire-neo4j-data:/data
      - grimoire-neo4j-logs:/logs
      - grimoire-neo4j-import:/var/lib/neo4j/import

  qdrant:
    profiles: ["db"]
    image: qdrant/qdrant:v1.12.1
    container_name: grimoire-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard
      - "6334:6334" # gRPC
    volumes:
      - grimoire-qdrant:/qdrant/storage

# DB성 데이터는 named volume (올인 컨테이너 원칙, PLANNING.md §8).
# 앱 데이터(./data의 스냅샷·그래프 JSON)는 개발 편의를 위해 당분간 바인드 마운트 유지 —
# 서버 배포 시나리오에서는 이것도 named volume으로 교체한다.
volumes:
  grimoire-ollama:
  grimoire-neo4j-data:
  grimoire-neo4j-logs:
  grimoire-neo4j-import:
  grimoire-qdrant:
