<svg width="40" height="240" viewBox="0 0 40 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 책등 기본 가죽 그라데이션 -->
    <linearGradient id="spineLeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141124" />
      <stop offset="25%" stop-color="#2a2048" />
      <stop offset="70%" stop-color="#1b1531" />
      <stop offset="100%" stop-color="#0a0814" />
    </linearGradient>
    
    <!-- 금박 룬 엠보싱 그라데이션 -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd875" />
      <stop offset="50%" stop-color="#e29b26" />
      <stop offset="100%" stop-color="#8a560c" />
    </linearGradient>
  </defs>

  <!-- 책등 본체 -->
  <rect width="40" height="240" rx="3" fill="url(#spineLeather)" />
  
  <!-- 상단/하단 가죽 밴드 립 (Ribs) -->
  <rect y="12" width="40" height="5" fill="url(#goldGlow)" opacity="0.8" />
  <rect y="19" width="40" height="2" fill="#000" opacity="0.5" />
  
  <rect y="70" width="40" height="4" fill="url(#goldGlow)" opacity="0.6" />
  <rect y="170" width="40" height="4" fill="url(#goldGlow)" opacity="0.6" />
  
  <rect y="220" width="40" height="5" fill="url(#goldGlow)" opacity="0.8" />
  <rect y="217" width="40" height="2" fill="#000" opacity="0.5" />

  <!-- 중앙 마법 룬 심볼 (지식그래프 노드) -->
  <g transform="translate(20, 120)">
    <!-- 회전하는 마법진 -->
    <circle r="12" stroke="url(#goldGlow)" stroke-width="1.2" stroke-dasharray="2 2" fill="none" opacity="0.9"/>
    <circle r="7" stroke="#a78bfa" stroke-width="1" fill="#1e1338" />
    
    <!-- 노드 연결선 -->
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#c084fc" stroke-width="1.5" />
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#c084fc" stroke-width="1.5" />
    
    <!-- 발광 노드들 -->
    <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
    <circle cx="-5" cy="-5" r="1.5" fill="#a78bfa" />
    <circle cx="5" cy="5" r="1.5" fill="#a78bfa" />
    <circle cx="5" cy="-5" r="1.5" fill="#38bdf8" />
    <circle cx="-5" cy="5" r="1.5" fill="#38bdf8" />
  </g>

  <!-- 가죽 하이라이트/음영 스트라이프 -->
  <line x1="3" y1="0" x2="3" y2="240" stroke="#ffffff" stroke-width="1" opacity="0.08" />
  <line x1="37" y1="0" x2="37" y2="240" stroke="#000000" stroke-width="2" opacity="0.4" />
</svg>
