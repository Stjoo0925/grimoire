<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 지식그래프 성간 연결선들 -->
  <g stroke="#6366f1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3">
    <line x1="120" y1="140" x2="280" y2="90" />
    <line x1="280" y1="90" x2="450" y2="180" />
    <line x1="450" y1="180" x2="620" y2="110" />
    <line x1="450" y1="180" x2="380" y2="340" />
    <line x1="380" y1="340" x2="220" y2="280" />
    <line x1="220" y1="280" x2="120" y2="140" />
    <line x1="380" y1="340" x2="520" y2="420" />
    <line x1="520" y1="420" x2="680" y2="310" />
    <line x1="620" y1="110" x2="680" y2="310" />
    <line x1="220" y1="280" x2="160" y2="460" />
    <line x1="160" y1="460" x2="340" y2="510" />
    <line x1="340" y1="510" x2="520" y2="420" />
  </g>

  <!-- 주요 지식 노드들 (발광 원형) -->
  <g>
    <!-- Project Node (Gold) -->
    <circle cx="280" cy="90" r="14" fill="url(#nodeGlow)"/>
    <circle cx="280" cy="90" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Tech Node (Purple) -->
    <circle cx="450" cy="180" r="20" fill="url(#nodeGlow)"/>
    <circle cx="450" cy="180" r="7" fill="#a855f7" stroke="#6b21a8" stroke-width="2"/>

    <!-- Concept Node (Cyan) -->
    <circle cx="380" cy="340" r="16" fill="url(#nodeGlow)"/>
    <circle cx="380" cy="340" r="6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Problem Node (Red/Orange) -->
    <circle cx="520" cy="420" r="14" fill="url(#nodeGlow)"/>
    <circle cx="520" cy="420" r="5" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>

    <!-- 서브 노드들 -->
    <circle cx="120" cy="140" r="3.5" fill="#818cf8" />
    <circle cx="620" cy="110" r="4" fill="#818cf8" />
    <circle cx="220" cy="280" r="4" fill="#c084fc" />
    <circle cx="680" cy="310" r="4.5" fill="#38bdf8" />
    <circle cx="160" cy="460" r="3" fill="#a78bfa" />
    <circle cx="340" cy="510" r="3.5" fill="#fef08a" />
  </g>
</svg>
