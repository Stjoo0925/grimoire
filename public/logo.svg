<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경 글로우 -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0"/>
      <stop offset="40%" stop-color="#3b0764" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#1e1035" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090514" stop-opacity="1"/>
    </radialGradient>

    <!-- 오라 후광 -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 가죽 표지 그라데이션 -->
    <linearGradient id="bookCover" x1="150" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0d1e"/>
    </linearGradient>

    <!-- 금빛 금속 트림 그라데이션 -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- 네온 퍼플 룬 그라데이션 -->
    <linearGradient id="neonRune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 원형 배경 -->
  <rect width="512" height="512" rx="110" fill="url(#spaceGlow)"/>

  <!-- 주변 마법 별자리 네트워크 (미세 연결선 & 노드) -->
  <g opacity="0.4" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="80" y1="120" x2="160" y2="90" />
    <line x1="160" y1="90" x2="260" y2="60" />
    <line x1="360" y1="70" x2="430" y2="130" />
    <line x1="430" y1="130" x2="450" y2="240" />
    <line x1="420" y1="380" x2="460" y2="440" />
    <line x1="80" y1="390" x2="140" y2="440" />
    <circle cx="80" cy="120" r="3" fill="#c084fc"/>
    <circle cx="160" cy="90" r="4" fill="#fef08a"/>
    <circle cx="430" cy="130" r="3.5" fill="#38bdf8"/>
    <circle cx="420" cy="380" r="4" fill="#f0abfc"/>
    <circle cx="140" cy="440" r="3" fill="#38bdf8"/>
  </g>

  <!-- 마법 오라 -->
  <circle cx="256" cy="256" r="190" fill="url(#auraGlow)" filter="url(#intenseGlow)"/>

  <!-- 마법진 링 (배경) -->
  <circle cx="256" cy="256" r="170" stroke="url(#goldMetal)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="256" cy="256" r="155" stroke="#c084fc" stroke-width="1" opacity="0.4"/>

  <!-- 3D 틸트된 마법서 본체 그룹 -->
  <g transform="rotate(-6 256 256)">
    <!-- 책 그림자 -->
    <rect x="135" y="105" width="250" height="315" rx="20" fill="#000000" opacity="0.7" filter="url(#glowFilter)"/>

    <!-- 책 밑장 종이 페이지 레이어들 -->
    <rect x="138" y="108" width="246" height="308" rx="18" fill="#d4af37" opacity="0.4"/>
    <rect x="134" y="104" width="246" height="308" rx="18" fill="#fef3c7" opacity="0.15"/>

    <!-- 마법서 가죽 표지 본체 -->
    <rect x="130" y="98" width="246" height="308" rx="18" fill="url(#bookCover)" stroke="url(#goldMetal)" stroke-width="3.5"/>

    <!-- 책등(Spine) 왼쪽 립 & 밴드 -->
    <path d="M130 116C130 106.059 138.059 98 148 98H165V406H148C138.059 406 130 397.941 130 388V116Z" fill="#140d2b" stroke="url(#goldMetal)" stroke-width="2"/>
    <line x1="130" y1="140" x2="165" y2="140" stroke="url(#goldMetal)" stroke-width="2"/>
    <line x1="130" y1="210" x2="165" y2="210" stroke="url(#goldMetal)" stroke-width="2"/>
    <line x1="130" y1="290" x2="165" y2="290" stroke="url(#goldMetal)" stroke-width="2"/>
    <line x1="130" y1="360" x2="165" y2="360" stroke="url(#goldMetal)" stroke-width="2"/>

    <!-- 표지 모서리 금속 장식 (Corner Ornaments) -->
    <!-- 좌상단 -->
    <path d="M165 98H195L165 128V98Z" fill="url(#goldMetal)"/>
    <!-- 우상단 -->
    <path d="M376 116C376 106.059 367.941 98 358 98H340L376 134V116Z" fill="url(#goldMetal)"/>
    <!-- 좌하단 -->
    <path d="M165 406H195L165 376V406Z" fill="url(#goldMetal)"/>
    <!-- 우하단 -->
    <path d="M376 388C376 397.941 367.941 406 358 406H340L376 370V388Z" fill="url(#goldMetal)"/>

    <!-- 표지 내부 금박 프레임 -->
    <rect x="175" y="112" width="188" height="280" rx="8" fill="none" stroke="url(#goldMetal)" stroke-width="1.8" opacity="0.85"/>

    <!-- 잠금 걸쇠 (Lock Clasp) -->
    <g transform="translate(365, 238)">
      <path d="M0 0H16C21.5228 0 26 4.47715 26 10V20C26 25.5228 21.5228 30 16 30H0V0Z" fill="url(#goldMetal)" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="12" cy="15" r="4" fill="#1e1b4b"/>
      <circle cx="12" cy="15" r="2" fill="#fef08a"/>
    </g>

    <!-- ★ 표지 중앙: 네온 지식그래프 룬 코어 (Knowledge Graph Core) ★ -->
    <g transform="translate(269, 252)" filter="url(#intenseGlow)">
      <!-- 중앙 팔각 마법 별 -->
      <circle cx="0" cy="0" r="46" stroke="url(#goldMetal)" stroke-width="2.5" fill="#150e28"/>
      <circle cx="0" cy="0" r="40" stroke="url(#neonRune)" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- 지식그래프 노드 연결선 (Edges) -->
      <line x1="0" y1="-26" x2="-22" y2="14" stroke="url(#neonRune)" stroke-width="2"/>
      <line x1="-22" y1="14" x2="22" y2="14" stroke="url(#neonRune)" stroke-width="2"/>
      <line x1="22" y1="14" x2="0" y2="-26" stroke="url(#neonRune)" stroke-width="2"/>
      <line x1="0" y1="26" x2="-22" y2="-14" stroke="url(#neonRune)" stroke-width="2"/>
      <line x1="-22" y1="-14" x2="22" y2="-14" stroke="url(#neonRune)" stroke-width="2"/>
      <line x1="22" y1="-14" x2="0" y2="26" stroke="url(#neonRune)" stroke-width="2"/>
      
      <!-- 외부로 뻗어나가는 성간 지식 노드 가지들 -->
      <line x1="0" y1="-26" x2="0" y2="-62" stroke="url(#neonRune)" stroke-width="1.8"/>
      <line x1="-22" y1="-14" x2="-55" y2="-38" stroke="url(#neonRune)" stroke-width="1.8"/>
      <line x1="-22" y1="14" x2="-55" y2="38" stroke="url(#neonRune)" stroke-width="1.8"/>
      <line x1="0" y1="26" x2="0" y2="62" stroke="url(#neonRune)" stroke-width="1.8"/>
      <line x1="22" y1="14" x2="55" y2="38" stroke="url(#neonRune)" stroke-width="1.8"/>
      <line x1="22" y1="-14" x2="55" y2="-38" stroke="url(#neonRune)" stroke-width="1.8"/>

      <!-- 발광 노드 정점들 (Nodes) -->
      <!-- 센터 코어 -->
      <circle cx="0" cy="0" r="9" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>

      <!-- 내부 6개 노드 -->
      <circle cx="0" cy="-26" r="4.5" fill="#f0abfc"/>
      <circle cx="0" cy="26" r="4.5" fill="#f0abfc"/>
      <circle cx="-22" cy="-14" r="4.5" fill="#38bdf8"/>
      <circle cx="-22" cy="14" r="4.5" fill="#38bdf8"/>
      <circle cx="22" cy="-14" r="4.5" fill="#c084fc"/>
      <circle cx="22" cy="14" r="4.5" fill="#c084fc"/>

      <!-- 외부 6개 확장 노드 -->
      <circle cx="0" cy="-62" r="5" fill="#fef08a"/>
      <circle cx="0" cy="62" r="5" fill="#fef08a"/>
      <circle cx="-55" cy="-38" r="4" fill="#38bdf8"/>
      <circle cx="-55" cy="38" r="4" fill="#38bdf8"/>
      <circle cx="55" cy="-38" r="4" fill="#c084fc"/>
      <circle cx="55" cy="38" r="4" fill="#c084fc"/>
    </g>
  </g>
</svg>
